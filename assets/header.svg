<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Jonathan GP — Software Engineering">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#161616" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050505" stop-opacity="0"/>
      <stop offset="1" stop-color="#050505" stop-opacity="1"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: "Helvetica Neue", Helvetica, Arial, "Segoe UI", sans-serif; }
      .dim  { fill: #6a6a6a; }
      .txt  { fill: #e8e8e8; }
      .acc  { fill: #2d72d2; }
      @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
      @keyframes pulse { 0% { r: 3; opacity: 1 } 100% { r: 14; opacity: 0 } }
      @keyframes sweep { from { transform: rotate(0deg) } to { transform: rotate(360deg) } }
      @keyframes scan  { from { transform: translateY(-2px) } to { transform: translateY(322px) } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .ring   { animation: pulse 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      .sweep  { animation: sweep 9s linear infinite; transform-origin: 1010px 160px; }
      .scan   { animation: scan 7s linear infinite; }
    </style>
  </defs>

  <!-- ground -->
  <rect width="1200" height="320" fill="#050505"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect x="700" width="500" height="320" fill="url(#fade)" opacity="0.6"/>

  <!-- scanline -->
  <rect class="scan" x="0" y="0" width="1200" height="1" fill="#2d72d2" opacity="0.18"/>

  <!-- frame -->
  <rect x="0.5" y="0.5" width="1199" height="319" fill="none" stroke="#1f1f1f"/>
  <!-- corner brackets -->
  <path d="M0 24V0H24 M1176 0H1200V24 M0 296V320H24 M1176 320H1200V296" fill="none" stroke="#5a5a5a" stroke-width="1.5"/>

  <!-- top meta -->
  <text class="mono dim" x="40" y="46" font-size="11" letter-spacing="2">SYS.PROFILE // SUNWEARSHADE</text>
  <text class="mono dim" x="1160" y="46" font-size="11" letter-spacing="2" text-anchor="end">ZACATECAS, MX  ·  22.77°N 102.58°W</text>
  <line x1="40" y1="60" x2="1160" y2="60" stroke="#1f1f1f"/>

  <!-- title -->
  <text class="sans txt" x="40" y="160" font-size="64" font-weight="500" letter-spacing="10">JONATHAN GP</text>
  <rect x="40" y="176" width="72" height="2" fill="#2d72d2"/>
  <text class="mono txt" x="40" y="212" font-size="14" letter-spacing="3">SOFTWARE ENGINEERING STUDENT<tspan class="dim">  //  BUILDING SYSTEMS THAT RUN</tspan><tspan class="cursor acc"> ▍</tspan></text>

  <!-- status -->
  <circle cx="46" cy="272" r="3" fill="#2d72d2"/>
  <circle class="ring" cx="46" cy="272" r="3" fill="none" stroke="#2d72d2" stroke-width="1"/>
  <text class="mono dim" x="60" y="276" font-size="11" letter-spacing="2">STATUS: ONLINE</text>
  <text class="mono dim" x="240" y="276" font-size="11" letter-spacing="2">STACK: JS · TS · PY · PHP</text>
  <text class="mono dim" x="500" y="276" font-size="11" letter-spacing="2">MODE: LEARNING · SHIPPING</text>

  <!-- reticle -->
  <g stroke="#3a3a3a" fill="none" stroke-width="1">
    <circle cx="1010" cy="160" r="96"/>
    <circle cx="1010" cy="160" r="64" stroke-dasharray="4 6"/>
    <circle cx="1010" cy="160" r="28"/>
    <line x1="1010" y1="40" x2="1010" y2="118"/>
    <line x1="1010" y1="202" x2="1010" y2="280"/>
    <line x1="890" y1="160" x2="968" y2="160"/>
    <line x1="1052" y1="160" x2="1130" y2="160"/>
    <!-- ticks -->
    <path d="M1010 64v6 M1010 250v6 M914 160h6 M1100 160h6"/>
  </g>
  <g class="sweep">
    <path d="M1010 160 L1010 64 A96 96 0 0 1 1078 92 Z" fill="#2d72d2" opacity="0.10"/>
    <line x1="1010" y1="160" x2="1010" y2="64" stroke="#2d72d2" stroke-width="1" opacity="0.8"/>
  </g>
  <circle cx="1010" cy="160" r="2.5" fill="#e8e8e8"/>
  <circle cx="1046" cy="131" r="2" fill="#2d72d2"/>
  <circle cx="982" cy="196" r="2" fill="#2d72d2"/>
  <text class="mono dim" x="1058" y="128" font-size="9" letter-spacing="1">TGT-01</text>
  <text class="mono dim" x="930" y="212" font-size="9" letter-spacing="1">TGT-02</text>

  <!-- bottom rule with ticks -->
  <line x1="40" y1="296" x2="1160" y2="296" stroke="#1f1f1f"/>
  <g stroke="#3a3a3a">
    <path d="M40 296v-5 M180 296v-5 M320 296v-5 M460 296v-5 M600 296v-5 M740 296v-5 M880 296v-5 M1020 296v-5 M1160 296v-5"/>
  </g>
</svg>
